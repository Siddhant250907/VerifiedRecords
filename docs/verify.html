        color:#bbbbbb;
        font-size:18px;
        margin-bottom:30px;

        its authenticity.

    </p>


    <form id="verifyForm">


        <div class="form-group">

            <label for="certificateId">

                Certificate ID

            </label>


            <input
                type="text"
                id="certificateId"
                placeholder="Example: CERT001"

        </div>



        <button
            type="submit"
