<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account - VerifiedRecords</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;

            background: #080808;
            color: white;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
        }

        .signup-container {

            width: 400px;

            padding: 35px;

            background: #120607;

            border: 1px solid #401016;

            border-radius: 15px;

            box-shadow:
                0 0 30px rgba(255, 0, 50, 0.15);
        }

        h1 {

            text-align: center;

            margin-bottom: 10px;
        }

        .subtitle {

            text-align: center;

            color: #aaa;

            margin-bottom: 30px;
        }

        input {

            width: 100%;

            padding: 14px;

            margin-bottom: 15px;

            border-radius: 8px;

            border: 1px solid #444;

            background: #181818;

            color: white;

            font-size: 15px;
        }

        button {

            width: 100%;

            padding: 14px;

            margin-top: 8px;

            border: none;

            border-radius: 8px;

            cursor: pointer;

            font-size: 16px;

            font-weight: bold;
        }

        .signup-btn {

            background: #20d45a;

            color: black;
        }

        .google-btn {

            background: white;

            color: black;
        }

        .back-btn {

            background: transparent;

            color: #20d45a;

            border: 1px solid #20d45a;
        }

        .divider {

            text-align: center;

            margin: 20px 0;

            color: #777;
        }

        #message {

            text-align: center;

            margin-top: 18px;

            color: #ff6666;
        }

    </style>

</head>


<body>


<div class="signup-container">

    <h1>VerifiedRecords</h1>

    <div class="subtitle">
        Create your account
    </div>


    <input
        type="email"
        id="email"
        placeholder="Email"
    >


    <input
        type="password"
        id="password"
        placeholder="Password"
    >


    <input
        type="password"
        id="confirmPassword"
        placeholder="Confirm Password"
    >


    <button
        class="signup-btn"
        onclick="createAccount()"
    >
        Create Account
    </button>


    <div class="divider">
        OR
    </div>


    <button
        class="google-btn"
        onclick="googleSignup()"
    >
        🔵 Continue with Google
    </button>


    <button
        class="back-btn"
        onclick="goToLogin()"
    >
        Back to Login
    </button>


    <div id="message"></div>

</div>



<!-- Firebase -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>


<script>


// ==========================================
// FIREBASE CONFIG
// ==========================================

const firebaseConfig = {

    apiKey:
        "AIzaSyDWzv5T0GjwDAlghvi2DLmc5V6T0Pq19ps",

    authDomain:
        "verifiedrecords.firebaseapp.com",

    projectId:
        "verifiedrecords",

    storageBucket:
        "verifiedrecords.firebasestorage.app",

    messagingSenderId:
        "823611310124",

    appId:
        "1:823611310124:web:8beb8902077e4a5eebd189"

};


// ==========================================
// INITIALIZE FIREBASE
// ==========================================

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();

function goToSignup() {

    window.location.href = "signup.html";

}
// ==========================================
// MESSAGE
// ==========================================

function showMessage(message, success = false) {

    const element =
        document.getElementById("message");

    element.innerText = message;

    element.style.color =
        success ? "#20d45a" : "#ff6666";
}


// ==========================================
// CREATE ACCOUNT
// ==========================================

async function createAccount() {

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    const confirmPassword =
        document.getElementById("confirmPassword").value;


    // Check fields

    if (!email || !password || !confirmPassword) {

        showMessage(
            "Please fill all fields."
        );

        return;
    }


    // Check password

    if (password.length < 6) {

        showMessage(
            "Password must contain at least 6 characters."
        );

        return;
    }


    // Check matching passwords

    if (password !== confirmPassword) {

        showMessage(
            "Passwords do not match."
        );

        return;
    }


    try {

        showMessage(
            "Creating your account...",
            true
        );


        // CREATE FIREBASE USER

        const userCredential =
            await auth.createUserWithEmailAndPassword(
                email,
                password
            );


        const user =
            userCredential.user;


        console.log(
            "Account created:",
            user.email
        );


        showMessage(
            "Account created successfully!",
            true
        );


        // Firebase has automatically signed
        // the user in at this point.


        setTimeout(() => {

            window.location.href =
                "admin.html";

        }, 1000);


    }

    catch (error) {

        console.error(
            "Signup error:",
            error
        );


        if (error.code ===
            "auth/email-already-in-use") {

            showMessage(
                "This email is already registered. Please login."
            );

        }

        else if (
            error.code ===
            "auth/invalid-email"
        ) {

            showMessage(
                "Please enter a valid email address."
            );

        }

        else if (
            error.code ===
            "auth/weak-password"
        ) {

            showMessage(
                "Password is too weak."
            );

        }

        else {

            showMessage(
                error.message
            );

        }

    }

}


// ==========================================
// GOOGLE SIGNUP
// ==========================================

async function googleSignup() {

    const provider =
        new firebase.auth.GoogleAuthProvider();


    try {

        showMessage(
            "Opening Google login...",
            true
        );


        await auth.signInWithPopup(
            provider
        );


        // User is now authenticated

        showMessage(
            "Google account connected!",
            true
        );


        setTimeout(() => {

            window.location.href =
                "admin.html";

        }, 700);


    }

    catch (error) {

        console.error(
            "Google signup error:",
            error
        );

        showMessage(
            error.message
        );

    }

}


// ==========================================
// BACK TO LOGIN
// ==========================================

function goToLogin() {

    window.location.href =
        "login.html";

}


</script>


</body>

</html>
