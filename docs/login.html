<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - VerifiedRecords</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            font-family: Arial, sans-serif;

            background: #080808;

            color: white;

            display: flex;

            justify-content: center;

            align-items: center;

            min-height: 100vh;
        }

        .login-container {

            width: 400px;

            padding: 35px;

            background: #120607;

            border: 1px solid #401016;

            border-radius: 15px;

            box-shadow:
                0 0 30px
                rgba(255, 0, 50, 0.15);
        }

        h1 {

            text-align: center;

            margin-bottom: 10px;
        }

        .subtitle {

            text-align: center;

            color: #aaa;

            margin-bottom: 30px;
        }

        input {

            width: 100%;

            padding: 14px;

            margin-bottom: 15px;

            border-radius: 8px;

            border: 1px solid #444;

            background: #181818;

            color: white;

            font-size: 15px;
        }

        button {

            width: 100%;

            padding: 14px;

            margin-top: 8px;

            border: none;

            border-radius: 8px;

            cursor: pointer;

            font-size: 16px;

            font-weight: bold;
        }

        .login-btn {

            background: #20d45a;

            color: black;
        }

        .google-btn {

            background: white;

            color: black;
        }

        .create-btn {

            background: transparent;

            color: #20d45a;

            border: 1px solid #20d45a;
        }

        .divider {

            text-align: center;

            margin: 20px 0;

            color: #777;
        }

        #message {

            text-align: center;

            margin-top: 18px;

            color: #ff6666;

            line-height: 1.4;
        }

    </style>

</head>


<body>


<div class="login-container">

    <h1>VerifiedRecords</h1>

    <div class="subtitle">
        Login to your account
    </div>


    <input
        type="email"
        id="email"
        placeholder="Email"
        autocomplete="email"
    >


    <input
        type="password"
        id="password"
        placeholder="Password"
        autocomplete="current-password"
    >


    <button
        class="login-btn"
        onclick="loginUser()"
    >
        Sign In
    </button>


    <div class="divider">
        OR
    </div>


    <button
        class="google-btn"
        onclick="googleLogin()"
    >
        🔵 Continue with Google
    </button>


    <button
        class="create-btn"
        onclick="createAccount()"
    >
        Create New Account
    </button>


    <div id="message"></div>

</div>



<!-- ========================================= -->
<!-- FIREBASE -->
<!-- ========================================= -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>



<script>

    // =========================================
    // FIREBASE CONFIG
    // =========================================

    const firebaseConfig = {

        apiKey:
            "AIzaSyDWzv5T0GjwDAlghvi2DLmc5V6T0Pq19ps",

        authDomain:
            "verifiedrecords.firebaseapp.com",

        projectId:
            "verifiedrecords",

        storageBucket:
            "verifiedrecords.firebasestorage.app",

        messagingSenderId:
            "823611310124",

        appId:
            "1:823611310124:web:8beb8902077e4a5eebd189"

    };


    // =========================================
    // INITIALIZE FIREBASE
    // =========================================

    firebase.initializeApp(firebaseConfig);

    const auth = firebase.auth();



    // =========================================
    // MESSAGE
    // =========================================

    function showMessage(message, success = false) {

        const element =
            document.getElementById("message");

        element.innerText = message;

        element.style.color =
            success
                ? "#20d45a"
                : "#ff6666";
    }



    // =========================================
    // CREATE ACCOUNT
    // =========================================

    async function createAccount() {

        const email =
            document.getElementById("email")
                .value
                .trim();

        const password =
            document.getElementById("password")
                .value;


        if (!email || !password) {

            showMessage(
                "Please enter email and password."
            );

            return;
        }


        if (password.length < 6) {

            showMessage(
                "Password must contain at least 6 characters."
            );

            return;
        }


        showMessage("Creating account...", true);


        try {

            const result =
                await auth.createUserWithEmailAndPassword(
                    email,
                    password
                );


            console.log(
                "Account created:",
                result.user
            );


            showMessage(
                "Account created successfully!",
                true
            );


            setTimeout(() => {

                window.location.href =
                    "admin.html";

            }, 1000);


        }

        catch (error) {

            console.error(
                "Create account error:",
                error
            );


            if (
                error.code ===
                "auth/email-already-in-use"
            ) {

                showMessage(
                    "This email already has an account. Please sign in."
                );

            }

            else if (
                error.code ===
                "auth/invalid-email"
            ) {

                showMessage(
                    "Please enter a valid email address."
                );

            }

            else if (
                error.code ===
                "auth/weak-password"
            ) {

                showMessage(
                    "Password is too weak."
                );

            }

            else {

                showMessage(
                    error.message
                );

            }

        }

    }



    // =========================================
    // EMAIL LOGIN
    // =========================================

    async function loginUser() {

        const email =
            document.getElementById("email")
                .value
                .trim();

        const password =
            document.getElementById("password")
                .value;


        if (!email || !password) {

            showMessage(
                "Please enter email and password."
            );

            return;
        }


        showMessage(
            "Signing in...",
            true
        );


        try {

            const result =
                await auth.signInWithEmailAndPassword(
                    email,
                    password
                );


            console.log(
                "Logged in user:",
                result.user
            );


            showMessage(
                "Login successful!",
                true
            );


            setTimeout(() => {

                window.location.href =
                    "admin.html";

            }, 700);


        }

        catch (error) {

            console.error(
                "Login error:",
                error
            );


            if (
                error.code ===
                "auth/user-not-found"
            ) {

                showMessage(
                    "No account found with this email."
                );

            }

            else if (
                error.code ===
                "auth/wrong-password"
            ) {

                showMessage(
                    "Incorrect password."
                );

            }

            else if (
                error.code ===
                "auth/invalid-credential"
            ) {

                showMessage(
                    "Incorrect email or password."
                );

            }

            else {

                showMessage(
                    error.message
                );

            }

        }

    }



    // =========================================
    // GOOGLE LOGIN
    // =========================================

    async function googleLogin() {

        showMessage(
            "Opening Google login...",
            true
        );


        const provider =
            new firebase.auth.GoogleAuthProvider();


        provider.setCustomParameters({

            prompt: "select_account"

        });


        try {

            const result =
                await auth.signInWithPopup(
                    provider
                );


            console.log(
                "Google user:",
                result.user
            );


            showMessage(
                "Google login successful!",
                true
            );


            setTimeout(() => {

                window.location.href =
                    "admin.html";

            }, 700);

        }

        catch (error) {

            console.error(
                "Google login error:",
                error
            );


            if (
                error.code ===
                "auth/unauthorized-domain"
            ) {

                showMessage(
                    "This website domain is not authorized in Firebase."
                );

            }

            else if (
                error.code ===
                "auth/popup-blocked"
            ) {

                showMessage(
                    "Google popup was blocked. Please allow popups for this website."
                );

            }

            else if (
                error.code ===
                "auth/popup-closed-by-user"
            ) {

                showMessage(
                    "Google login was cancelled."
                );

            }

            else {

                showMessage(
                    error.message
                );

            }

        }

    }

</script>


</body>

</html>
