<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - VerifiedRecords</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #080808;
            color: white;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
        }

        .login-container {
            width: 400px;
            padding: 35px;

            background: #120607;
            border: 1px solid #401016;
            border-radius: 15px;

            box-shadow: 0 0 30px rgba(255, 0, 50, 0.15);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #aaa;
            margin-bottom: 30px;
        }

        input {
            width: 100%;
            padding: 14px;

            margin-bottom: 15px;

            border-radius: 8px;
            border: 1px solid #444;

            background: #181818;
            color: white;

            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 14px;

            margin-top: 8px;

            border: none;
            border-radius: 8px;

            cursor: pointer;

            font-size: 16px;
            font-weight: bold;
        }

        .login-btn {
            background: #20d45a;
            color: black;
        }

        .google-btn {
            background: white;
            color: black;
        }

        .create-btn {
            background: transparent;
            color: #20d45a;
            border: 1px solid #20d45a;
        }

        .divider {
            text-align: center;
            margin: 20px 0;
            color: #777;
        }

        #message {
            text-align: center;
            margin-top: 18px;
            color: #ff6666;
        }
    </style>
</head>

<body>

<div class="login-container">

    <h1>VerifiedRecords</h1>

    <div class="subtitle">
        Login to your account
    </div>

    <input
        type="email"
        id="email"
        placeholder="Email"
    >

    <input
        type="password"
        id="password"
        placeholder="Password"
    >

    <button
        class="login-btn"
        onclick="loginUser()"
    >
        Sign In
    </button>

    <div class="divider">
        OR
    </div>

    <button
        class="google-btn"
        onclick="googleLogin()"
    >
        🔵 Continue with Google
    </button>

    <button
        class="create-btn"
        onclick="createAccount()"
    >
        Create New Account
    </button>

    <div id="message"></div>

</div>


<!-- Firebase -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>


<script>

    // ==========================================
    // FIREBASE CONFIG
    // ==========================================

    const firebaseConfig = {

        apiKey: "AIzaSyDWzv5T0GjwDAlghvi2DLmc5V6T0Pq19ps",

        authDomain: "verifiedrecords.firebaseapp.com",

        projectId: "verifiedrecords",

        storageBucket: "verifiedrecords.firebasestorage.app",

        messagingSenderId: "823611310124",

        appId: "1:823611310124:web:8beb8902077e4a5eebd189"

    };


    // Initialize Firebase

    firebase.initializeApp(firebaseConfig);

    const auth = firebase.auth();


    // ==========================================
    // MESSAGE
    // ==========================================

    function showMessage(message, success = false) {

        const element =
            document.getElementById("message");

        element.innerText = message;

        element.style.color =
            success ? "#20d45a" : "#ff6666";
    }


    // ==========================================
    // CREATE ACCOUNT
    // ==========================================

    async function createAccount() {

        const email =
            document.getElementById("email").value;

        const password =
            document.getElementById("password").value;


        if (!email || !password) {

            showMessage(
                "Please enter email and password."
            );

            return;
        }


        if (password.length < 6) {

            showMessage(
                "Password must contain at least 6 characters."
            );

            return;
        }


        try {

            await auth.createUserWithEmailAndPassword(
                email,
                password
            );


            showMessage(
                "Account created successfully!",
                true
            );


            setTimeout(() => {

                window.location.href =
                    "admin.html";

            }, 1000);


        } catch (error) {

            console.error(error);

            showMessage(
                error.message
            );

        }

    }


    // ==========================================
    // LOGIN
    // ==========================================

    async function loginUser() {

        const email =
            document.getElementById("email").value;

        const password =
            document.getElementById("password").value;


        if (!email || !password) {

            showMessage(
                "Please enter email and password."
            );

            return;
        }


        try {

            await auth.signInWithEmailAndPassword(
                email,
                password
            );


            showMessage(
                "Login successful!",
                true
            );


            setTimeout(() => {

                window.location.href =
                    "admin.html";

            }, 700);


        } catch (error) {

            console.error(error);

            showMessage(
                "Invalid email or password."
            );

        }

    }


    // ==========================================
    // GOOGLE LOGIN
    // ==========================================

    async function googleLogin() {

        const provider =
            new firebase.auth.GoogleAuthProvider();


        try {

            await auth.signInWithPopup(provider);


            showMessage(
                "Google login successful!",
                true
            );


            setTimeout(() => {

                window.location.href =
                    "admin.html";

            }, 700);


        } catch (error) {

            console.error(error);

            showMessage(
                error.message
            );

        }

    }

</script>

</body>
</html>
