<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin | VerifiedRecords</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet"
          href="assets/css/style.css">

</head>

<body>

    <!-- NAVBAR -->

    <nav class="top-navbar">

        <div class="nav-left">

            <a href="index.html"
               class="nav-icon"
               data-tooltip="Home">

                <i class="fa-solid fa-house"></i>

            </a>

            <a href="admin.html"
               class="nav-icon"
               data-tooltip="Admin">

                <i class="fa-solid fa-user-shield"></i>

            </a>

            <a href="verify.html"
               class="nav-icon"
               data-tooltip="Verify">

                <i class="fa-solid fa-certificate"></i>

            </a>

            <a href="about.html"
               class="nav-icon"
               data-tooltip="About">

                <i class="fa-solid fa-circle-info"></i>

            </a>

        </div>


        <div class="nav-right">

            <a href="login.html"
               class="login-btn">

                <i class="fa-solid fa-user"></i>

                LOGIN / SIGNUP

            </a>

        </div>

    </nav>


    <!-- ADMIN CONTENT -->

    <main class="admin-page">

        <div class="admin-container">

            <div class="admin-heading">

                <p>VERIFIEDRECORDS ADMIN</p>

                <h1>Issue Certificate</h1>

                <span>
                    Create and record a new academic certificate.
                </span>

            </div>


            <div class="certificate-card">

                <form id="certificateForm">


                    <div class="input-group">

                        <label for="studentName">
                            Student Name
                        </label>

                        <input
                            type="text"
                            id="studentName"
                            placeholder="Enter student name"
                            required>

                    </div>


                    <div class="input-group">

                        <label for="rollNumber">
                            Roll Number
                        </label>

                        <input
                            type="text"
                            id="rollNumber"
                            placeholder="Enter roll number"
                            required>

                    </div>


                    <div class="input-group">

                        <label for="course">
                            Course
                        </label>

                        <input
                            type="text"
                            id="course"
                            placeholder="Enter course"
                            required>

                    </div>


                    <div class="input-group">

                        <label for="certificateId">
                            Certificate ID
                        </label>

                        <input
                            type="text"
                            id="certificateId"
                            placeholder="Enter certificate ID"
                            required>

                    </div>


                    <div class="input-group">

                        <label for="issueDate">
                            Issue Date
                        </label>

                        <input
                            type="date"
                            id="issueDate"
                            required>

                    </div>


                    <button
                        type="submit"
                        class="issue-btn">

                        <i class="fa-solid fa-file-circle-plus"></i>

                        Issue Certificate →

                    </button>


                </form>

            </div>

        </div>

    </main>


    <script src="assets/js/admin.js"></script>

</body>

</html>
