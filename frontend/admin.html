<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="index.html">🎓 CertiChain</a>
    </div>
</nav>

<div class="container mt-5">

    <div class="card shadow p-4">

        <h2 class="text-center mb-4">Issue Certificate</h2>

        <form id="certificateForm">

            <div class="mb-3">
                <label>Student Name</label>
                <input type="text" class="form-control" id="studentName">
            </div>

            <div class="mb-3">
                <label>Roll Number</label>
                <input type="text" class="form-control" id="rollNumber">
            </div>

            <div class="mb-3">
                <label>Course</label>
                <input type="text" class="form-control" id="course">
            </div>

            <div class="mb-3">
                <label>Certificate ID</label>
                <input type="text" class="form-control" id="certificateId">
            </div>

            <div class="mb-3">
                <label>Issue Date</label>
                <input type="date" class="form-control" id="issueDate">
            </div>

            <button class="btn btn-primary w-100">
                Issue Certificate
            </button>

        </form>

    </div>

</div>

<script src="assets/js/admin.js"></script>

</body>
</html>
