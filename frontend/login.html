<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | VerifiedRecords</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="assets/css/style.css">

</head>


<body>


    <!-- NAVIGATION -->

    <nav class="navbar">

        <div class="nav-left">

            <a href="index.html" class="nav-link">
                HOME
            </a>

            <a href="admin.html" class="nav-link">
                ADMIN
            </a>

            <a href="verify.html" class="nav-link">
                VERIFY
            </a>

        </div>


        <div class="nav-right">

            <a href="login.html" class="login-btn">
                LOGIN / SIGNUP
            </a>

        </div>

    </nav>



    <!-- WEBSITE NAME -->

    <header class="site-header">

        <div class="brand">

            <div class="brand-name">
                VerifiedRecords
            </div>

            <div class="brand-tagline">
                BLOCKCHAIN • TRUST • VERIFICATION
            </div>

        </div>

    </header>



    <!-- LOGIN SECTION -->

    <main class="login-container">

        <div class="login-card">

            <h1>Welcome Back</h1>

            <p class="login-subtitle">
                Login to VerifiedRecords
            </p>


            <form>

                <div class="input-group">

                    <label>Email</label>

                    <input
                        type="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="input-group">

                    <label>Password</label>

                    <input
                        type="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="login-submit"
                >
                    LOGIN
                </button>

            </form>


            <p class="signup-text">

                Don't have an account?

                <a href="#">
                    Sign Up
                </a>

            </p>


            <a href="index.html" class="back-home">
                ← Back to Home
            </a>

        </div>

    </main>


</body>

</html>
